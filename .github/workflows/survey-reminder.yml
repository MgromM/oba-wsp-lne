name: Send dinner survey reminder

on:
  schedule:
    # Every hour, on the hour (UTC). The script itself only acts when it's
    # actually 12:00 in Warsaw, so this stays correct across DST changes.
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm install --omit=dev

      - name: Check and send reminder
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node send-survey-reminder.mjs
