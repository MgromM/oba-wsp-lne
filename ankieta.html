<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Jak było?</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icons/favicon-32-v2.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<meta name="theme-color" content="#2f6f62">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#faf6f0; --paper-raised:#ffffff; --ink:#2b2630; --ink-soft:#6b6270;
    --line:#e7ddd0; --accent:#2f6f62; --accent-bg:#e3efe9;
    --shadow: 0 1px 2px rgba(43,38,48,.06), 0 6px 20px rgba(43,38,48,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1c1a1f; --paper-raised:#262330; --ink:#ede8f0; --ink-soft:#a89fb0;
      --line:#3a3542; --accent:#6fcbb3; --accent-bg:#22332e;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',system-ui,sans-serif; }
  .wrap{ max-width:520px; margin:0 auto; padding:32px 18px 60px; }
  h1{ font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:clamp(24px,7vw,32px); margin:0 0 6px; text-wrap:balance; }
  p.sub{ color:var(--ink-soft); margin:0 0 24px; font-size:14.5px; }
  .card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:20px; margin-bottom:16px; }
  .whoami{ display:flex; gap:8px; margin-bottom:20px; }
  .who-btn{
    border:1px solid var(--line); background:var(--paper-raised); color:var(--ink);
    padding:10px 18px; min-height:44px; border-radius:999px; font-family:inherit;
    font-size:15px; font-weight:600; cursor:pointer;
  }
  .who-btn[data-active="true"]{ border-color:var(--accent); background:var(--accent-bg); color:var(--accent); }
  label{ font-family:'Fraunces',Georgia,serif; font-size:16px; font-weight:600; display:block; margin-bottom:10px; }
  .scale{ display:flex; gap:8px; flex-wrap:wrap; }
  .scale button{
    border:1px solid var(--line); background:var(--paper); color:var(--ink);
    font-size:22px; min-width:52px; min-height:52px; border-radius:12px; cursor:pointer;
    font-family:inherit;
  }
  .scale button[data-active="true"]{ border-color:var(--accent); background:var(--accent-bg); }
  textarea{
    width:100%; min-height:80px; padding:11px 10px; border-radius:9px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink); font-family:inherit; font-size:15px; resize:vertical;
  }
  button.primary{
    border:none; background:var(--ink); color:var(--paper); padding:14px 20px; min-height:48px;
    border-radius:9px; font-family:inherit; font-weight:600; font-size:15px; cursor:pointer; width:100%;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) button.primary{ background:var(--accent); color:#12211c; } }
  button.primary:disabled{ opacity:.4; cursor:not-allowed; }
  .status{ font-size:13px; color:var(--ink-soft); margin-top:10px; text-align:center; min-height:18px; }
  .done{ text-align:center; padding:40px 20px; }
  .done .emoji{ font-size:48px; }
  .done h2{ font-family:'Fraunces',Georgia,serif; margin:12px 0 6px; }
  .done[hidden], .formArea[hidden]{ display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Jak było na kolacji? 🍽</h1>
  <p class="sub">Dwa szybkie pytania, zajmie 10 sekund.</p>

  <div class="whoami">
    <button class="who-btn" data-person="michal" id="btn-michal">Michał</button>
    <button class="who-btn" data-person="ona" id="btn-ona">Aga</button>
  </div>

  <div class="formArea" id="formArea">
    <div class="card">
      <label>Jak jedzenie?</label>
      <div class="scale" id="foodScale">
        <button type="button" data-v="1">😖</button>
        <button type="button" data-v="2">🙁</button>
        <button type="button" data-v="3">😐</button>
        <button type="button" data-v="4">🙂</button>
        <button type="button" data-v="5">😍</button>
      </div>
    </div>
    <div class="card">
      <label>Jak wieczór ogólnie?</label>
      <div class="scale" id="eveningScale">
        <button type="button" data-v="1">😴</button>
        <button type="button" data-v="2">🙁</button>
        <button type="button" data-v="3">😐</button>
        <button type="button" data-v="4">😊</button>
        <button type="button" data-v="5">🥰</button>
      </div>
    </div>
    <div class="card">
      <label>Coś jeszcze? (opcjonalnie)</label>
      <textarea id="comment" maxlength="300" placeholder="np. wracamy tam koniecznie..."></textarea>
    </div>
    <button type="button" class="primary" id="submitBtn" disabled>Wyślij</button>
    <div class="status" id="status"></div>
  </div>

  <div class="done" id="done" hidden>
    <div class="emoji">🎉</div>
    <h2>Dzięki!</h2>
    <p class="sub">Odpowiedź zapisana.</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlAjb5gNcZfaHMBKglquZ4JD3lhBs1tao",
  authDomain: "oba-wolne.firebaseapp.com",
  projectId: "oba-wolne",
  storageBucket: "oba-wolne.firebasestorage.app",
  messagingSenderId: "542262689847",
  appId: "1:542262689847:web:af9c318aa74843d8ab3fb2"
};
const fbApp = initializeApp(firebaseConfig);
const firestore = getFirestore(fbApp);

const params = new URLSearchParams(location.search);
const dinnerDate = params.get('date') || new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Warsaw' })
  .format(new Date(Date.now() - 86400000));

let me = localStorage.getItem('kolacja_who') || null;
let foodRating = null;
let eveningRating = null;

function setWho(person){
  me = person;
  localStorage.setItem('kolacja_who', person);
  document.getElementById('btn-michal').setAttribute('data-active', person==='michal');
  document.getElementById('btn-ona').setAttribute('data-active', person==='ona');
  updateSubmitState();
}
document.getElementById('btn-michal').addEventListener('click', ()=>setWho('michal'));
document.getElementById('btn-ona').addEventListener('click', ()=>setWho('ona'));
if(me) setWho(me);

function wireScale(id, onPick){
  const el = document.getElementById(id);
  el.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      el.querySelectorAll('button').forEach(b=>b.setAttribute('data-active', 'false'));
      btn.setAttribute('data-active', 'true');
      onPick(Number(btn.dataset.v));
    });
  });
}
wireScale('foodScale', v=>{ foodRating = v; updateSubmitState(); });
wireScale('eveningScale', v=>{ eveningRating = v; updateSubmitState(); });

function updateSubmitState(){
  document.getElementById('submitBtn').disabled = !(me && foodRating && eveningRating);
}

document.getElementById('submitBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  const comment = document.getElementById('comment').value.trim().slice(0, 300);
  const docId = `${dinnerDate}_${me}`;
  try{
    await setDoc(doc(firestore, 'survey_responses', docId), {
      date: dinnerDate, person: me, foodRating, eveningRating, comment,
      submittedAt: Date.now()
    });
    document.getElementById('formArea').hidden = true;
    document.getElementById('done').hidden = false;
  }catch(e){
    status.textContent = 'Nie udało się zapisać — spróbuj ponownie.';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
