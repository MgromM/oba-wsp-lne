<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Pytanie</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#faf6f0;
    --ink:#2b2630;
    --ink-soft:#6b6270;
    --line:#e7ddd0;
    --yes:#2f6f62;
    --yes-bg:#e3efe9;
    --no-bg:#f8e6ec;
    --no-border:#b8365f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1c1a1f;
      --ink:#ede8f0;
      --ink-soft:#a89fb0;
      --line:#3a3542;
      --yes:#6fcbb3;
      --yes-bg:#22332e;
      --no-bg:#3a2530;
      --no-border:#f292b3;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1c1a1f;
    --ink:#ede8f0;
    --ink-soft:#a89fb0;
    --line:#3a3542;
    --yes:#6fcbb3;
    --yes-bg:#22332e;
    --no-bg:#3a2530;
    --no-border:#f292b3;
  }
  *{ box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    overflow:hidden;
    position:relative;
  }
  .center{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:34px;
    padding:24px;
    text-align:center;
  }
  h1{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    font-size:clamp(24px,6vw,36px);
    margin:0;
    max-width:20ch;
    text-wrap:balance;
    letter-spacing:-.01em;
  }
  .buttons{
    position:relative;
    width:100%;
    max-width:520px;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
  }
  button{
    font-family:inherit;
    font-weight:700;
    font-size:17px;
    border-radius:999px;
    cursor:pointer;
    padding:14px 30px;
    min-height:52px;
  }
  #yes{
    border:2px solid var(--yes);
    background:var(--yes-bg);
    color:var(--yes);
    transition:transform .15s;
  }
  #yes:hover{ transform:scale(1.04); }
  #no{
    border:2px solid var(--no-border);
    background:var(--no-bg);
    color:var(--no-border);
  }
  #no.fleeing{
    position:fixed;
    transition:top .18s ease, left .18s ease;
  }
  .hint{
    color:var(--ink-soft);
    font-size:13.5px;
    min-height:18px;
  }
</style>
</head>
<body>
  <div class="center">
    <h1>Czy chcesz wyjść z Michałem na kolację?</h1>
    <div class="buttons">
      <button id="yes">Tak</button>
      <button id="no">Nie</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>

<script>
const noBtn = document.getElementById('no');
const hint = document.getElementById('hint');
const messages = [
  'Spróbuj jeszcze raz.',
  'Prawie, ale nie tym razem.',
  'Ten przycisk jest nieuchwytny.',
  'No dalej, spróbuj złapać.',
  'Odpowiedź nie zmieni się na "nie".'
];
let noClicks = 0;

function placeNoRandomly(){
  const btnRect = noBtn.getBoundingClientRect();
  const margin = 16;
  const maxX = window.innerWidth - btnRect.width - margin;
  const maxY = window.innerHeight - btnRect.height - margin;
  const x = margin + Math.random() * Math.max(0, maxX - margin);
  const y = margin + Math.random() * Math.max(0, maxY - margin);
  noBtn.style.left = x + 'px';
  noBtn.style.top = y + 'px';
}

noBtn.addEventListener('click', (e)=>{
  e.preventDefault();
  noBtn.classList.add('fleeing');
  placeNoRandomly();
  hint.textContent = messages[noClicks % messages.length];
  noClicks++;
});

document.getElementById('yes').addEventListener('click', ()=>{
  window.location.href = 'app.html';
});
</script>
</body>
</html>
